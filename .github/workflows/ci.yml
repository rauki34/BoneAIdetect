name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装最小依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: 静态检查（只查"代码跑不起来"这一类）
        run: ruff check .

      - name: 单元测试（不碰模型 / 数据库 / 网络）
        run: pytest tests/unit -q

      # 说明：tests/integration 需要完整应用与数据库，且会加载 YOLO 权重，
      # 不在 CI 里跑（见 requirements-ci.txt 的注释）。RAG、Agent 真实编排、
      # 检测链路的验收由 scripts/verify_*.py 在本机执行。

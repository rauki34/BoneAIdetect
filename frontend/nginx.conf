# nginx 配置：托管 SPA 静态产物 + 反向代理后端
#
# ⚠️ **未经实跑验证**（开发机无 Docker，阶段 11 时的状态）。
#
# 三条代理规则各自对应一类真实流量，缺一条就有一块功能打不开：
#   /api      —— 全部接口（前端走相对路径，见 .env.production）
#   /results  —— 检测结果图（后端写成完整 URL 存进库，但前端也有相对路径引用）
#   /uploads  —— 原始上传图
#   /ws       —— 视频检测的 WebSocket（需要 Upgrade 头，否则握手失败）

upstream backend {
    server backend:5000;
}

server {
    listen 80;
    server_name _;

    # 上传上限与后端 RAG_MAX_UPLOAD_MB 保持一致，否则大文件在 nginx 这一层就被拒
    client_max_body_size 50m;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 前端路由：刷新 /doctor/workstation 这类地址时不能 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Agent 编排实测可达 90 秒，默认 60s 会把长请求掐断
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # SSE（/api/ai-assistant/chat/stream）必须关掉缓冲
        proxy_buffering off;
    }

    location /results {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    location /uploads {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    location /ws {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;      # 视频检测长连接
    }
}

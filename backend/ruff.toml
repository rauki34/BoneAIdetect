# ruff 配置（阶段 11）
#
# **只开"代码根本跑不起来"这一类规则**，不引入风格规则：
#
#   E9  —— 语法/解析类错误（如悬空语句）
#   F63 —— 断言里用了 `is` 比较字面量、比较恒为真之类的写法错误
#   F7  —— 语法层面的可疑写法（如 `not in` 之外的 F70x 系列）
#   F82 —— 未定义名字 / 未使用导入
#
# 为什么不上整套默认规则：本仓库此前没有 linter，一把开起来会产出成百上千条
# 风格类告警（行长、命名、导入顺序……），把真正的问题淹没在噪声里。这四条
# 的价值已经被验证过两次 —— 它们抓到的都是**只在错误路径上出现、正常路径
# 永远走不到**的真 bug：
#
#   1. scripts/verify_knowledge_base.py 用 `load_document` 却没导入，而调用点
#      包在 `except Exception: continue` 里，那条"切片章节必须来自原文标题"的
#      检查一直空过（报告还硬编码写着"抽查 50 篇"）。
#   2. app.py 的 video_ws 错误分支用 `json.dumps` 却没导入 `json`，
#      "任务不存在"这个提示从来没发出去过。
#
# 这两处与 BASELINE 二·补七 第 7 条（错误处理器自己坏了）是同一类问题。
# 将来若要扩展规则，建议先在现有代码上跑一遍看新增多少条，再决定是否值当。
line-length = 100
target-version = "py311"

[lint]
select = ["E9", "F63", "F7", "F82"]
ignore = ["F701", "F702"]   # Python 3 里语法上不可能出现，留着无意义
